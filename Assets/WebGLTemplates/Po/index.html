<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f17">
    <meta name="po-version" content="{{{ PRODUCT_VERSION }}}">
    <link rel="icon" href="data:,">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* PoHillKing's page around the WebGL player. The chrome is drawn here, once, OUTSIDE the canvas, so it can never
         sit on the game's HUD (which hides its own title and version in a browser: HudView.PageDrawsChrome): a 44 px top
         bar (the name, the fullscreen and /diag buttons) and a 20 px footer with the build's version. The canvas fills
         everything between them in any orientation (16:9 or 9:16); the HUD lays itself out in a 9:16 column. */
      :root { --bg: #0b0f17; --surface: #121826; --line: #1f2737; --text: #e6e9f2; --muted: #9aa3b5; --accent: #6366f1;
              --bar: 44px; --foot: 20px; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
                   font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { display: flex; flex-direction: column; height: 100dvh; }
      .po-bar { flex: 0 0 var(--bar); height: var(--bar); display: flex; align-items: center; gap: 8px;
                padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
                background: var(--surface); border-bottom: 1px solid var(--line); }
      .po-brand { color: var(--text); text-decoration: none; font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
      .po-spacer { flex: 1; }
      .po-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 8px;
                border: 1px solid var(--line); background: var(--bg); color: var(--text); text-decoration: none;
                font: 16px/1 system-ui, sans-serif; cursor: pointer; padding: 0; }
      .po-btn:hover, .po-btn:focus-visible { border-color: var(--accent); outline: none; }
      #frame { position: relative; flex: 1 1 auto; min-height: 0; }
      #unity-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg);
                      outline: none; touch-action: none; }
      .po-foot { flex: 0 0 var(--foot); height: var(--foot); display: flex; align-items: center; justify-content: flex-end;
                 padding: 0 max(10px, env(safe-area-inset-right)); background: var(--surface); border-top: 1px solid var(--line);
                 font-size: 11px; color: var(--muted); }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 14px; font-weight: 600; font-size: 14px; letter-spacing: 0.12em; color: var(--text); }
      #bar { width: min(60%, 360px); height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
      #fill { width: 0; height: 100%; background: var(--accent); }
      #error { position: absolute; left: 8%; right: 8%; bottom: 8%; display: none; padding: 12px; border-radius: 6px;
               background: #5a1a1a; color: #fff; font-size: 13px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <header class="po-bar">
      <a class="po-brand" href="/">{{{ PRODUCT_NAME }}}</a>
      <span class="po-spacer"></span>
      <button class="po-btn" id="fullscreen" type="button" aria-label="Fullscreen" title="Fullscreen">⛶</button>
      <a class="po-btn" href="/diag" aria-label="System status" title="System status (/diag)">⚙</a>
    </header>
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading"><div>Loading…</div><div id="bar"><div id="fill"></div></div></div>
      <div id="error"></div>
    </div>
    <footer class="po-foot"><span class="po-version">v{{{ PRODUCT_VERSION }}}</span></footer>
    <script>
      var canvas = document.getElementById("unity-canvas");
      var loading = document.getElementById("loading");
      var fill = document.getElementById("fill");
      var errorBox = document.getElementById("error");
      var instance = null;

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
      }

      document.getElementById("fullscreen").addEventListener("click", function () {
        if (instance) instance.SetFullscreen(1);
        else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      });

      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        matchWebGLToCanvasSize: true,
        showBanner: function (message, type) {
          if (type === "error") showError(message);
        },
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
        }).then(function (unity) {
          instance = unity;
          loading.style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          showError(String(message));
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
