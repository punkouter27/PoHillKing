name: Deploy WebGL

# SAME FILE IN EVERY PO UNITY GAME. The reference copy is PoBox's; copy it with
# PoPunkouterSoftware/scripts/sync-ci.ps1, never edit one game's copy.
#
# The WebGL player is built LOCALLY (Unity needs a licence; CI has none) by Tools/publish_webgl.ps1,
# which uploads it as webgl.zip on a GitHub Release tagged webgl-*. Publishing that release runs
# this workflow on a GitHub-hosted runner: download the zip -> deploy to the game's Azure Static
# Web App -> check the live page. No Unity, no self-hosted runner.
#
# Re-deploy an existing build: Actions -> Deploy WebGL -> Run workflow, with its tag
# (empty = the newest webgl-* release).
#
# Repo secret it needs:
#   AZURE_STATIC_WEB_APPS_API_TOKEN   the game's Static Web App deployment token
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: webgl-* release tag to deploy (empty = newest)
        required: false

permissions:
  contents: read

concurrency:
  group: webgl-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'webgl-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the WebGL build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("webgl-"))] | sort_by(.createdAt) | last | .tagName')
          fi
          test -n "$TAG" || { echo "No webgl-* release. Run Tools/publish_webgl.ps1 first."; exit 1; }
          echo "Deploying $TAG"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p webgl.zip -D .
          mkdir site && unzip -q webgl.zip -d site
          test -f site/index.html || { echo "webgl.zip of $TAG has no index.html at its root"; exit 1; }
          test -f site/staticwebapp.config.json || { echo "webgl.zip of $TAG has no staticwebapp.config.json (.unityweb would 404)"; exit 1; }

      - name: Deploy to Azure Static Web App
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true

      # The page is live and is a Unity WebGL page, not an old or empty site.
      - name: Check the live page
        env:
          URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 30 "$URL" | grep -q 'loader.js'; then echo "Live: $URL"; exit 0; fi
            sleep 15
          done
          echo "$URL did not serve the WebGL page"; exit 1
