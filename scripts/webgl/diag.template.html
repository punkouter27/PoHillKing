<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f17">
<title>System status · __TITLE__</title>
<!-- Written by scripts/publish_webgl.ps1 from scripts/webgl/diag.template.html and scripts/webgl.json (diagChecks).
     Every row is probed live from this browser; nothing is shown as healthy without a response. -->
<style>
  :root { --bg: #0b0f17; --surface: #121826; --line: #232b3d; --text: #e6e9f2; --muted: #9aa3b5; --accent: #6366f1;
          --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
           border-bottom: 1px solid var(--line); background: var(--surface); }
  header a { color: var(--text); text-decoration: none; font-weight: 600; }
  header a.back { color: var(--muted); font-weight: 500; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 4px 0 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 24px 0 8px; }
  .banner { padding: 14px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; }
  .banner.ok { border-color: var(--ok); } .banner.bad { border-color: var(--bad); } .banner.wait { border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 16px; background: var(--surface);
         border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .row .name { font-weight: 600; } .row .detail { grid-column: 1 / -1; color: var(--muted); font-size: 12px; word-break: break-all; }
  .state { font-weight: 600; white-space: nowrap; } .state.ok { color: var(--ok); } .state.bad { color: var(--bad); }
  .state.warn { color: var(--warn); } .state.off { color: var(--muted); } .state.wait { color: var(--accent); }
  .checked { color: var(--muted); font-size: 12px; margin: 16px 0 0; } .checked a { color: var(--text); }
  footer { position: fixed; right: 0; bottom: 0; left: 0; height: 20px; padding: 0 12px; display: flex; justify-content: flex-end;
           align-items: center; font-size: 11px; color: var(--muted); background: var(--bg); }
  /* On a phone the stamp follows the content instead of floating over the last rows. */
  @media (max-width: 600px) { footer { position: static; height: auto; padding: 8px 16px 16px; } main { padding-bottom: 8px; } }
</style>
</head>
<body>
<header><a href="/">__TITLE__</a><a class="back" href="/">Back to the game</a></header>
<main>
  <h1>System status</h1>
  <div id="banner" class="banner wait">Checking…</div>
  <div id="sections"></div>
  <p id="checked" class="checked"></p>
</main>
<footer id="version">v__VERSION__</footer>
<script>
(function () {
  var VERSION = "__VERSION__";
  var CHECKS = __CHECKS__;      // [{section, name, url, used}] from scripts/webgl.json
  var BUNDLE = __BUNDLE__;      // the Build/ files of this build
  var order = ["API", "Data", "Services"];
  var rows = [];

  CHECKS.forEach(function (c) { rows.push({ section: c.section, name: c.name, url: c.url, detail: c.used, kind: "fetch" }); });
  rows.push({ section: "API", name: "Game page (this build: loader and v" + VERSION + ")", url: "./", kind: "page" });
  rows.push({ section: "API", name: "Deployed commit (X-Commit header)", url: "./", kind: "commit" });
  BUNDLE.forEach(function (f) { rows.push({ section: "Data", name: "Build bundle: " + f, url: "Build/" + f, kind: "head" }); });
  rows.push({ section: "Services", name: "3D renderer (WebGL2)", kind: "webgl2" });

  var holder = document.getElementById("sections");
  order.forEach(function (s) {
    var list = rows.filter(function (r) { return r.section === s; });
    if (!list.length) return;
    var h = document.createElement("h2"); h.textContent = s; holder.appendChild(h);
    list.forEach(function (r) {
      var el = document.createElement("div"); el.className = "row";
      el.innerHTML = '<span class="name"></span><span class="state wait">Checking…</span><span class="detail"></span>';
      el.querySelector(".name").textContent = r.name;
      el.querySelector(".detail").textContent = (r.url ? r.url : "") + (r.detail ? (r.url ? " · " : "") + r.detail : "");
      holder.appendChild(el); r.el = el;
    });
  });

  function set(r, cls, text) { var s = r.el.querySelector(".state"); s.className = "state " + cls; s.textContent = text; r.state = cls; }

  // Results are kept for MAX_AGE_S seconds per browser tab and build (sessionStorage), so reloading /diag does not probe
  // every service again; /diag?fresh (the "Re-check now" link) always probes.
  var MAX_AGE_S = 60;
  var STORE_KEY = "pohillking.diag.v" + VERSION;
  var FRESH = /[?&]fresh(=|&|$)/.test(location.search);
  function cached() {
    if (FRESH) return null;
    try {
      var c = JSON.parse(sessionStorage.getItem(STORE_KEY) || "null");
      if (c && c.rows && c.rows.length === rows.length && Date.now() - c.at < MAX_AGE_S * 1000) return c;
    } catch (e) { /* storage blocked or corrupt: probe */ }
    return null;
  }
  var saved = cached();
  function timed(url, method, body) {
    var ctl = new AbortController(); var t0 = performance.now(); var timer = setTimeout(function () { ctl.abort(); }, 10000);
    return fetch(url, { method: method, cache: "no-store", signal: ctl.signal, mode: "cors" })
      .then(function (res) {
        var r = { ok: res.ok, status: res.status, commit: res.headers.get("x-commit"), size: res.headers.get("content-length") };
        return (body ? res.text() : Promise.resolve("")).then(function (text) {
          clearTimeout(timer); r.text = text; r.ms = Math.round(performance.now() - t0); return r;
        });
      })
      .catch(function (e) { clearTimeout(timer); return { ok: false, status: e.name === "AbortError" ? "timeout" : "network error", ms: Math.round(performance.now() - t0) }; });
  }

  var jobs = saved ? rows.map(function (r, i) { set(r, saved.rows[i][0], saved.rows[i][1]); return Promise.resolve(); }) : rows.map(function (r) {
    if (r.kind === "page") {
      return timed(r.url, "GET", true).then(function (x) {
        var mine = x.ok && x.text.indexOf("loader.js") >= 0 && x.text.indexOf('content="' + VERSION + '"') >= 0;
        if (mine) set(r, "ok", "OK · " + x.ms + " ms");
        else set(r, "bad", x.ok ? "Other build · " + x.ms + " ms" : "Failed (" + x.status + ") · " + x.ms + " ms");
      });
    }
    if (r.kind === "commit") {
      return timed(r.url, "HEAD").then(function (x) {
        if (x.ok && x.commit) set(r, "ok", x.commit.slice(0, 7) + " · " + x.ms + " ms");
        else set(r, "bad", x.ok ? "Missing" : "Failed (" + x.status + ")");
      });
    }
    if (r.kind === "webgl2") {
      var ok = !!document.createElement("canvas").getContext("webgl2");
      set(r, ok ? "ok" : "bad", ok ? "Available" : "Unavailable"); return Promise.resolve();
    }
    // No URL: the dependency is switched off on purpose (Off is neutral and does not count toward the banner).
    if (!r.url) { set(r, "off", "Off"); return Promise.resolve(); }
    return timed(r.url, r.kind === "head" ? "HEAD" : "GET").then(function (x) {
      var size = r.kind === "head" && x.size ? " · " + Math.round(x.size / 1024) + " KB" : "";
      if (x.ok) set(r, "ok", "OK · " + x.ms + " ms" + size); else set(r, "bad", "Failed (" + x.status + ") · " + x.ms + " ms");
    });
  });

  Promise.all(jobs).then(function () {
    var live = rows.filter(function (r) { return r.state !== "off"; }), off = rows.length - live.length;
    var bad = live.filter(function (r) { return r.state === "bad"; }).length;
    var b = document.getElementById("banner");
    b.className = "banner " + (bad ? "bad" : "ok");
    b.textContent = (bad ? "Degraded: " + bad + " of " + live.length + " live checks failing" : "All systems operational (" + live.length + " live checks)")
      + (off ? " · " + off + " off on purpose" : "");
    var at = saved ? saved.at : Date.now();
    if (!saved) {
      try { sessionStorage.setItem(STORE_KEY, JSON.stringify({ at: at, rows: rows.map(function (r) { return [r.state, r.el.querySelector(".state").textContent]; }) })); }
      catch (e) { /* no storage: nothing kept */ }
    }
    var note = document.getElementById("checked");
    note.textContent = (saved ? "Probed " + Math.round((Date.now() - at) / 1000) + " s ago" : "Checked just now")
      + " from this browser (" + new Date(at).toISOString().replace("T", " ").slice(0, 19) + " UTC); results are kept " + MAX_AGE_S + " s. ";
    var again = document.createElement("a"); again.href = "?fresh"; again.textContent = "Re-check now"; note.appendChild(again);
  });
})();
</script>
</body>
</html>
